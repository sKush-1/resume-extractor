apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: resume-etl
    component: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      component: api-gateway
  template:
    metadata:
      labels:
        app: resume-etl
        component: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: resume-etl/api-gateway:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: resume-etl-config
            - secretRef:
                name: resume-etl-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    component: api-gateway
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
