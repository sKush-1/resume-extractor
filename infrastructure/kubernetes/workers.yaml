apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser-worker
  labels:
    app: resume-etl
    component: parser-worker
spec:
  replicas: 4
  selector:
    matchLabels:
      component: parser-worker
  template:
    metadata:
      labels:
        app: resume-etl
        component: parser-worker
    spec:
      containers:
        - name: parser-worker
          image: resume-etl/parser-worker:latest
          envFrom:
            - configMapRef:
                name: resume-etl-config
            - secretRef:
                name: resume-etl-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: export-service
  labels:
    app: resume-etl
    component: export-service
spec:
  replicas: 1
  selector:
    matchLabels:
      component: export-service
  template:
    metadata:
      labels:
        app: resume-etl
        component: export-service
    spec:
      containers:
        - name: export-service
          image: resume-etl/export-service:latest
          envFrom:
            - configMapRef:
                name: resume-etl-config
            - secretRef:
                name: resume-etl-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: resume-etl-config
data:
  NODE_ENV: production
  STORAGE_PROVIDER: s3
  AI_PROVIDER: ollama
  WORKER_CONCURRENCY: "4"
  MAX_FILE_SIZE_MB: "10"
  MAX_FILES_PER_BATCH: "1000"
